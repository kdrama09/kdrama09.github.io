<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>SD Stream</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" class="splash">
  <div class="sd-logo"><span>S</span><b>D</b><i>▶</i></div>
  <div class="loading">Loading</div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand"><div class="mini-logo">SD</div><div><strong>SD STREAM</strong><small>Drama & Movies</small></div></div>
    <button class="icon-btn" id="searchBtn">⌕</button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <span class="pill">FEATURED</span>
        <h1 id="heroTitle">Moonlit Promise</h1>
        <p id="heroDesc">A new journey begins when two strangers are brought together by a forgotten promise.</p>
        <button class="primary" id="heroPlay">▶ Watch Now</button>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Categories</h2></div>
      <div class="chips">
        <button class="chip active" data-filter="All">All</button>
        <button class="chip" data-filter="Chinese Drama">🇨🇳 Chinese</button>
        <button class="chip" data-filter="K-Drama">🇰🇷 K-Drama</button>
        <button class="chip" data-filter="Japanese Drama">🇯🇵 Japanese</button>
        <button class="chip" data-filter="Asian">🌏 Asian</button>
      </div>
    </section>

    <section class="section">
      <div class="section-head"><h2>Trending Now</h2><button class="link" id="seeAll">See all</button></div>
      <div id="catalog" class="catalog"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav active">⌂<span>Home</span></button>
    <button class="nav" id="moviesNav">▣<span>Movies</span></button>
    <button class="nav" id="seriesNav">▤<span>Series</span></button>
    <button class="nav" id="favNav">♡<span>Favorites</span></button>
  </nav>
</div>

<div id="details" class="modal hidden">
  <button class="close" id="closeDetails">×</button>
  <div id="detailPoster" class="detail-poster"></div>
  <div class="detail-body">
    <span id="detailGenre" class="pill"></span>
    <h2 id="detailTitle"></h2>
    <p id="detailDesc"></p>
    <div class="meta" id="detailMeta"></div>
    <button class="primary full" id="watchBtn">▶ Watch / Trailer</button>
    <h3>Episodes</h3>
    <div id="episodes" class="episodes"></div>
  </div>
</div>

<div id="searchModal" class="search-modal hidden">
  <div class="search-head"><input id="searchInput" placeholder="Search drama or movie..."><button id="closeSearch">×</button></div>
  <div id="searchResults" class="catalog"></div>
</div>

<div id="toast" class="toast"></div>
<script src="script.js"></script>
</body>
</html>
